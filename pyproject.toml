[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runmal"
version = "0.1.0"
description = "Rúnmál — sovereign AI chat app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Volmarr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pytest-asyncio>=0.24"]

[project.scripts]
runmal = "runmal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runmal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
