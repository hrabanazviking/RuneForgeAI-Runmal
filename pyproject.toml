[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runmal"
version = "0.1.0"
description = "Rúnmál — sovereign AI chat app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Volmarr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "python-multipart>=0.0.18",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pytest-asyncio>=0.24"]
# Campaign V voice extras — every entry passed the S504 license gate
# (docs/VOICE_LICENSE_MATRIX.md): Apache-2.0 / MIT / BSD only. Model
# weights (Whisper small, Silero VAD) download separately into cache
# dirs; no eSpeak-NG carrier is permitted in this tree. Kokoro/misaki
# were REMOVED (ADR-0005): misaki[en] directly requires the forbidden
# eSpeak-NG carriers espeakng-loader / phonemizer-fork (GPL-3.0).
voice = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
]
# ADR-0005 default-shipped TTS backends. These lists MIRROR the curated
# --no-deps install sets in runmal.voice.backends (COSYVOICE_PACKAGES /
# CHATTERBOX_PACKAGES); tests/test_s504_tts.py guards drift both ways.
# The extras exist for developers and the default-tree audit; the app
# itself installs backends only through the one-button machinery.
voice-cosyvoice = [
    "conformer",
    "diffusers",
      "HyperPyYAML",
    "inflect",
    "lightning",
    "matplotlib",
    "modelscope==1.32.0",
    "networkx",
    "numpy",
    "omegaconf",
    "onnxruntime",
    "protobuf",
    "pydantic",
    "rich",
    "soundfile",
    "tensorboard",
    "transformers==5.2.0",
    "WeTextProcessing",
    "wget",
    "x-transformers",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cpu/torchaudio-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl",
    "einops",
    "huggingface-hub>=1.3.0,<2.0",
    "tokenizers==0.22.1",
    "ruamel.yaml",
    "openai-whisper",
    "tiktoken",
    "more-itertools",
    "numba",
    "llvmlite",
    "pynini",
    "importlib_resources",
    "regex",
    "requests",
    "urllib3",
    "charset-normalizer",
    "sympy",
    "mpmath",
    "typeguard",
]
voice-chatterbox = [
    "chatterbox-tts==0.1.7",
    "numpy>=1.24,<2.0",
    "librosa==0.11.0",
    "s3tokenizer",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==5.2.0",
    "diffusers==0.29.0",
    "resemble-perth @ git+https://github.com/resemble-ai/Perth@ff1c8ac55a976971245cdd53c18d6131ca00d993",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "spacy-pkuseg",
    "pyloudnorm",
    "omegaconf",
]

[project.scripts]
runmal = "runmal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runmal"]

# The voice-chatterbox extra pins resemble-perth to an exact upstream
# commit via a direct git reference (ADR-0005) — hatchling requires
# this explicit allowance for direct references.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/runmal/app.py" = ["B008"]
"src/runmal/characters/router.py" = ["B008"]
"src/runmal/chats/router.py" = ["B008"]
"src/runmal/db/deps.py" = ["B008"]
"src/runmal/generation/router.py" = ["B008"]
"src/runmal/groupchat/router.py" = ["B008"]
"src/runmal/lorebooks/router.py" = ["B008"]
"src/runmal/memory/router.py" = ["B008"]
"src/runmal/prompt/router.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "manual: tagged manual/hardware tests (may skip when hardware is absent)",
]
