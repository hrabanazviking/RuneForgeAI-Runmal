[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runmal"
version = "0.1.0"
description = "Rúnmál — sovereign AI chat app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Volmarr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "python-multipart>=0.0.18",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pytest-asyncio>=0.24"]
# Campaign V voice extras — every entry passed the S504 license gate
# (docs/VOICE_LICENSE_MATRIX.md): Apache-2.0 / MIT / BSD only. Model
# weights (Whisper small, Silero VAD) download separately into cache
# dirs; no eSpeak-NG carrier is permitted in this tree. Kokoro/misaki
# were REMOVED (ADR-0005): misaki[en] directly requires the forbidden
# eSpeak-NG carriers espeakng-loader / phonemizer-fork (GPL-3.0).
voice = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
]
# ADR-0005 TTS backend extras. These lists MIRROR the install sets
# in runmal.voice.backends (COSYVOICE_PACKAGES / CHATTERBOX_PACKAGES);
# tests/test_s504_tts.py guards drift both ways. The extras exist for
# developers and the default-tree audit; the app itself installs
# backends only through the one-button machinery. voice-cosyvoice is
# the default-shipped curated --no-deps set; voice-chatterbox names
# the stock package of a USER-INSTALLED backend (Volmarr's ruling,
# 2026-10-13) plus the setuptools environment prerequisite its
# Perth dependency fails to declare — pip resolves upstream's full
# tree for it, and it is never part of the default shipped tree.
voice-cosyvoice = [
    "conformer",
    "diffusers==0.29.0",
    "hydra-core",
    "antlr4-python3-runtime==4.9.3",
      "HyperPyYAML",
    "inflect",
    "lightning",
    "matplotlib",
    "modelscope==1.32.0",
    "networkx",
    "numpy",
    "omegaconf",
    "onnxruntime",
    "protobuf",
    "pillow",
    "pydantic",
    "rich",
    "safetensors",
    "scipy",
    "soundfile",
    "tensorboard",
    "transformers==4.51.3",
    "wget",
    "x-transformers",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cpu/torchaudio-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl",
    "einops",
    "huggingface-hub==0.36.0",
    "tokenizers==0.21.4",
    "ruamel.yaml==0.17.21",
    "openai-whisper",
    "tiktoken",
    "more-itertools",
    "numba",
    "llvmlite",
    "pyyaml",
    "regex",
    "requests",
    "urllib3",
    "charset-normalizer",
    "sympy",
    "mpmath",
    "typeguard",
    "cloudpickle",
    "librosa",
    "lazy_loader",
    "msgpack",
    "pooch",
    "platformdirs",
    "decorator",
    "audioread",
    "joblib",
    "scikit-learn",
    "threadpoolctl",
    "narwhals",
    "gdown",
    "beautifulsoup4",
    "soupsieve",
    "pyarrow",
    "pyworld",
    "setuptools==80.9.0",
    "lightning-utilities",
    "torchmetrics",
    "pyparsing",
    "kiwisolver",
    "cycler",
    "fonttools",
    "contourpy",
    "python-dateutil",
    "six",
]
voice-chatterbox = [
    "chatterbox-tts==0.1.7",
    "setuptools==80.9.0",
]

[project.scripts]
runmal = "runmal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runmal"]

# Direct references remain in the voice-cosyvoice extra's history of
# pinned wheels; hatchling requires this explicit allowance for
# direct references wherever they appear.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/runmal/app.py" = ["B008"]
"src/runmal/bridge/auth.py" = ["B008"]
"src/runmal/bridge/router.py" = ["B008"]
"src/runmal/characters/router.py" = ["B008"]
"src/runmal/chats/router.py" = ["B008"]
"src/runmal/db/deps.py" = ["B008"]
"src/runmal/generation/router.py" = ["B008"]
"src/runmal/groupchat/router.py" = ["B008"]
"src/runmal/lorebooks/router.py" = ["B008"]
"src/runmal/memory/router.py" = ["B008"]
"src/runmal/prompt/router.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "manual: tagged manual/hardware tests (may skip when hardware is absent)",
]
