[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runmal"
version = "0.1.0"
description = "Rúnmál — sovereign AI chat app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Volmarr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "python-multipart>=0.0.18",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pytest-asyncio>=0.24"]
# Campaign V voice extras — every entry passed the S504 license gate
# (docs/VOICE_LICENSE_MATRIX.md): Apache-2.0 / MIT / BSD only. Model
# weights (Whisper small, Kokoro-82M, Silero VAD) download separately
# into cache dirs; no eSpeak-NG carrier is permitted in this tree.
voice = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "misaki[en]>=0.9",
]

[project.scripts]
runmal = "runmal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runmal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/runmal/app.py" = ["B008"]
"src/runmal/characters/router.py" = ["B008"]
"src/runmal/chats/router.py" = ["B008"]
"src/runmal/db/deps.py" = ["B008"]
"src/runmal/generation/router.py" = ["B008"]
"src/runmal/groupchat/router.py" = ["B008"]
"src/runmal/lorebooks/router.py" = ["B008"]
"src/runmal/memory/router.py" = ["B008"]
"src/runmal/prompt/router.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "manual: tagged manual/hardware tests (may skip when hardware is absent)",
]
