name: Desktop launcher and packages

on:
  pull_request:
    paths:
      - "src/runmal/**"
      - "tests/**"
      - "pyproject.toml"
      - "packaging/**"
      - "scripts/install-*.sh"
      - "scripts/install-*.ps1"
      - ".github/workflows/desktop-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-tests:
    name: Launcher tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test environment
        run: python -m pip install -e ".[dev]"
      - name: Run launcher and auth acceptance tests
        run: python -m pytest -q tests/test_s102_auth.py tests/test_launcher_auth.py tests/test_launcher_core.py
      - name: Run complete regression suite on Linux
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -q
      - name: Lint launcher/security changes on Linux
        if: matrix.os == 'ubuntu-latest'
        run: python -m ruff check src/runmal/launcher src/runmal/auth.py src/runmal/app.py tests/test_launcher_auth.py tests/test_launcher_core.py
      - name: Smoke launcher CLI
        run: python -m runmal.launcher status

  windows-package:
    name: Windows x64-compatible installer
    runs-on: windows-latest
    needs: launcher-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and build tools
        run: python -m pip install -e . pyinstaller pillow
      - name: Build Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -c "from PIL import Image; im=Image.open('docs/images/runmal-emblem.png').convert('RGBA'); im.save('build/runmal.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Runmal
          --icon build/runmal.ico
          --hidden-import tkinter
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.scrolledtext
          --collect-all runmal
          src/runmal/launcher/frozen_entry.py
      - name: Smoke frozen Windows launcher
        shell: pwsh
        run: |
          & .\dist\Runmal\Runmal.exe status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke frozen Windows server
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\dist\Runmal\Runmal.exe -ArgumentList "_serve","--port","18098" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 100; $i++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18098/healthz" -TimeoutSec 1
                if ($response.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 200
            }
            if (-not $ready) {
              throw "Frozen Windows server failed its /healthz check."
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows Setup executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.1.0 packaging\windows\runmal.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Runmal-Windows-Setup
          path: artifacts/Runmal-Setup.exe
          if-no-files-found: error

  macos-package:
    name: macOS package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: launcher-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple-Silicon
            artifact: Runmal-macOS-Apple-Silicon-DMG
            dmg: Runmal-macOS-Apple-Silicon.dmg
          - os: macos-15-intel
            label: Intel
            artifact: Runmal-macOS-Intel-DMG
            dmg: Runmal-macOS-Intel.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and build tools
        run: python -m pip install -e . pyinstaller pillow
      - name: Build application bundle
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name Runmal
          --icon docs/images/runmal-emblem.png
          --hidden-import tkinter
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.scrolledtext
          --collect-all runmal
          src/runmal/launcher/frozen_entry.py
      - name: Smoke frozen macOS launcher
        run: dist/Runmal.app/Contents/MacOS/Runmal status
      - name: Smoke frozen macOS server
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/runmal-server.log"
          dist/Runmal.app/Contents/MacOS/Runmal _serve --port 18098 >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18098/healthz >/dev/null; then
              READY=1
              break
            fi
            sleep 0.2
          done
          if [[ "$READY" -ne 1 ]]; then
            cat "$LOG"
            exit 1
          fi
      - name: Build DMG
        run: |
          mkdir -p artifacts dmg-root
          cp -R dist/Runmal.app dmg-root/Runmal.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Rúnmál" -srcfolder dmg-root -ov -format UDZO "artifacts/${{ matrix.dmg }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.dmg }}
          if-no-files-found: error

  linux-package:
    name: Linux DEB (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: launcher-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            artifact: Runmal-Linux-DEB-amd64
            deb: runmal_0.1.0_amd64.deb
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: Runmal-Linux-DEB-arm64
            deb: runmal_0.1.0_arm64.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Install app and build tools
        run: python -m pip install -e . pyinstaller
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --onedir
          --name runmal
          --hidden-import tkinter
          --hidden-import tkinter.messagebox
          --hidden-import tkinter.scrolledtext
          --collect-all runmal
          src/runmal/launcher/frozen_entry.py
      - name: Smoke frozen Linux launcher
        run: dist/runmal/runmal status
      - name: Smoke frozen Linux server
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/runmal-server.log"
          dist/runmal/runmal _serve --port 18098 >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18098/healthz >/dev/null; then
              READY=1
              break
            fi
            sleep 0.2
          done
          if [[ "$READY" -ne 1 ]]; then
            cat "$LOG"
            exit 1
          fi
      - name: Build Debian package
        run: |
          mkdir -p package/DEBIAN package/opt/runmal package/usr/share/applications package/usr/share/icons/hicolor/512x512/apps artifacts
          cp -a dist/runmal/. package/opt/runmal/
          cp packaging/linux/runmal.desktop package/usr/share/applications/runmal.desktop
          cp docs/images/runmal-emblem.png package/usr/share/icons/hicolor/512x512/apps/runmal.png
          cat > package/DEBIAN/control <<EOF
          Package: runmal
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Volmarr
          Description: Rúnmál sovereign local AI chat application
          EOF
          dpkg-deb --build package "artifacts/${{ matrix.deb }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.deb }}
          if-no-files-found: error
