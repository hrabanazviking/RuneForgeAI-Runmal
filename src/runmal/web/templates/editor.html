<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rúnmál — persona editor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip-link" href="#editor-main">Skip to content</a>
<main id="editor-main" class="page">
  <h1>Persona / scenario / greetings</h1>
  <p class="hint">Edits save to the character card; greetings round-trip
     exactly. Token file: <code>{{ credential_hint }}</code></p>
  <div id="error-banner" class="hidden" role="alert">
    <span id="error-text"></span>
    <button id="error-dismiss" type="button">Dismiss</button>
  </div>
  <div id="save-notice" class="hidden" role="status">Saved.</div>
  <label>Character
    <select id="character-select" aria-label="Character"></select>
  </label>
  <form id="editor-form">
    <label>Description
      <textarea id="f-description" rows="4"></textarea>
    </label>
    <label>Personality
      <textarea id="f-personality" rows="3"></textarea>
    </label>
    <label>Scenario
      <textarea id="f-scenario" rows="3"></textarea>
    </label>
    <label>First message
      <textarea id="f-first-mes" rows="3"></textarea>
    </label>
    <fieldset>
      <legend>Alternate greetings</legend>
      <div id="greetings-list"></div>
      <button id="add-greeting" type="button">Add greeting</button>
    </fieldset>
    <button type="submit">Save</button>
  </form>
</main>
<script src="/static/theme.js"></script>
<script src="/static/editor.js"></script>

<div id="palette" class="hidden" role="dialog" aria-label="Command palette">
  <div id="palette-card">
    <input id="palette-input" type="text" placeholder="Type a command…" aria-label="Command search">
    <ul id="palette-list" role="listbox" aria-label="Commands"></ul>
  </div>
</div>
<script src="/static/palette.js"></script>
</body>
</html>
