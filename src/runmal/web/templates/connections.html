<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rúnmál — connections</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main id="connections-main" class="page">
  <h1>Connections</h1>
  <p class="hint">Backend connection profiles. Exactly one is active.
     Token file: <code>{{ credential_hint }}</code></p>
  <div id="error-banner" class="hidden" role="alert">
    <span id="error-text"></span>
    <button id="error-dismiss" type="button">Dismiss</button>
  </div>
  <ul id="connection-list"></ul>
  <section id="health-panel" class="hidden">
    <h2>Health</h2>
    <pre id="health-result"></pre>
    <label>Model from probe
      <select id="health-models"></select>
    </label>
    <button id="apply-model" type="button">Set as profile model</button>
  </section>
  <form id="create-form">
    <h2>New profile</h2>
    <label>Name <input id="f-name" required></label>
    <label>Backend
      <select id="f-backend">
        <option value="fake">fake</option>
        <option value="ollama">ollama</option>
        <option value="openai">openai</option>
      </select>
    </label>
    <label>Base URL <input id="f-url" placeholder="http://localhost:11434"></label>
    <label>Model <input id="f-model"></label>
    <button type="submit">Create</button>
  </form>
</main>
<script src="/static/theme.js"></script>
<script src="/static/connections.js"></script>

<div id="palette" class="hidden" role="dialog" aria-label="Command palette">
  <div id="palette-card">
    <input id="palette-input" type="text" placeholder="Type a command…" aria-label="Command search">
    <ul id="palette-list"></ul>
  </div>
</div>
<script src="/static/palette.js"></script>
</body>
</html>
